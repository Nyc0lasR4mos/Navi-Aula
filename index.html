
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navi</title>
    
        <link rel="icon" type="image/png" href="./navi.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
        crossorigin="anonymous"
        
    >

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="style.css">

    <style>
        .search-button {
            width: 40px;
            height: 40px;
            min-width: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: none;
            border-radius: 8px;
        }

        .search-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Navi</a>

            <button
                class="btn-icon navbar-toggler"
                type="button"
                data-bs-toggle="drawer"
                data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog
                class="drawer drawer-end"
                tabindex="-1"
                id="navbarDrawer"
                aria-labelledby="navbarDrawerLabel"
            >
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">
                        Menu
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="drawer"
                        aria-label="Close"
                    ></button>
                </div>

                <div class="drawer-body mb-2 md:mb-0">

                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="https://www.google.com/?zx=1793123677449"
                            >Rede</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="https://www.youtube.com/watch?v=Uoox9fpmDP0">
                                Conectar-se
                            </a>
                        </li>

                        <li class="nav-item">
                            <button
                                class="nav-link"
                                type="button"
                                data-bs-toggle="menu"
                                aria-expanded="false"
                            >
                                Cyberia
                            </button>

                            <div class="menu">
                                <a class="menu-item" href="https://lain.fandom.com/wiki/Navi">Navi</a>
                                <a class="menu-item" href="https://tse1.mm.bing.net/th/id/OIP.BuMh5EYD88yoDde7BckEBwHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">Lain</a>
                                <hr class="menu-divider">
                                <a class="menu-item" href="https://www.terminaltemple.com/">
                                    Terminal
                                </a>
                            </div>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">
                                Lain
                            </a>
                        </li>
                    </ul>

                    <form class="hstack gap-2" role="search">
                        <input
                            class="form-control"
                            type="search"
                            placeholder="Search"
                            aria-label="Search"
                        >

                        <button
                            class="btn-solid btn-icon theme-secondary search-button"
                            type="submit"
                            aria-label="Pesquisar"
                        >
                            <img
                                src="https://chichi-pui.akamaized.net/uploads/users/icons/25f301c3-a9d6-409d-bc4f-92b579593910_5f4O4FNg6Z.jpeg?impolicy=resize-width-auto-height&w=200"
                                alt=""
                                class="search-image"
                            >
                        </button>
                    </form>

                </div>
            </dialog>
        </div>
    </nav>
    <div class="card-container">
        <section class="card">
            <img
                src="https://lain.wiki/images/thumb/a/ae/Cyberia.jpg/300px-Cyberia.jpg"
                class="card-img-top"
                alt=""
            >
    
            <div class="card-body">
                <h4 class="card-title">Quem é Lain?</h4>
                <p class="card-text">Conecte-se ao Club Cyberia</p>
    
                <a
                    href="https://lain.wiki/wiki/Cyberia"
                    class="btn-solid theme-primary"
                >
                    Club Cyberia
                </a>
            </div>
        </section>
    
        <button type="button" class="btn-subtle theme-warning">
            Warning
        </button>
        <div id="carouselStackedIndicators" class="carousel slide">
            <div class="carousel-inner rounded-5">
              <div class="carousel-item active">
                <img src="Lain.webp" class="d-block w-100" alt="">
              </div>
              <div class="carousel-item">
                <img src="https://tse2.mm.bing.net/th/id/OIP.BnLpgZhTcBrydQRi_KTHtQHaEo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item">
                <img src="https://tse4.mm.bing.net/th/id/OIP.d0wbG0YOpiSWx5XCLaLj-wHaFZ?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item">
                <img src="https://i.pinimg.com/originals/58/da/30/58da3055fd30a39e8694e076b33422cb.jpg" class="d-block w-100" alt="...">
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="prev">
                  <span class="carousel-icon-prev" aria-hidden="true"></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide="next">
                  <span class="carousel-icon-next" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
              <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
              </div>
            </div>
          </div>
    </div>
</body>
</html>
